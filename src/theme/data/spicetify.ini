[caelestia]
text                = {{ onSurface.hex }}                                               ; Main text colour
subtext             = {{ onSurfaceVariant.hex }}                                        ; Subtext colour
main                = {{ mode ? dark=surfaceContainer.hex | surface.hex }}              ; Panel backgrounds
highlight           = {{ primary.hex }}                                                 ; Doesn't seem to do anything
misc                = {{ primary.hex }}                                                 ; Doesn't seem to do anything
notification        = {{ outline.hex }}                                                 ; Notifications probably
notification-error  = {{ error.hex }}                                                   ; Error notifications probably
shadow              = 000000                                                            ; Shadow for covers, context menu, also affects playlist/artist banners
card                = {{ mode ? dark=surfaceContainerHigh.hex | surfaceContainer.hex }} ; Context menu and tooltips
player              = {{ secondaryContainer.hex }}                                      ; Background for top result in search
sidebar             = {{ mode ? dark=surface.hex | surfaceContainer.hex }}              ; Background
main-elevated       = {{ surfaceContainerHigh.hex }}                                    ; Higher layers than main, e.g. search bar
highlight-elevated  = {{ surfaceContainerHighest.hex }}                                 ; Home button and search bar accelerator
selected-row        = {{ onSurface.hex }}                                               ; Selections, hover, other coloured text and slider background
button              = {{ primary.hex }}                                                 ; Slider and text buttons
button-active       = {{ primary.hex }}                                                 ; Background buttons
button-disabled     = {{ outline.hex }}                                                 ; Disabled buttons
tab-active          = {{ mode ? dark=surfaceContainerHigh.hex | surfaceContainer.hex }} ; Profile fallbacks in search
